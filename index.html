<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - HTML5 Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 70%, #90EE90 100%);
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            display: none;
        }

        .game-over h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff4444;
        }

        .game-over p {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .game-over .score-display {
            font-size: 32px;
            font-weight: bold;
            color: #ffdd44;
            margin: 20px 0;
        }

        .game-over .restart-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: all;
            transition: background 0.3s;
        }

        .game-over .restart-btn:hover {
            background: #45a049;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            text-align: center;
            font-size: 16px;
            pointer-events: none;
        }

        .mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: all;
            touch-action: manipulation;
        }

        @media (max-width: 500px) {
            .game-container {
                width: 320px;
                height: 480px;
            }
        }

        .pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            pointer-events: all;
        }

        .pause-btn:hover {
            background: rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="game-ui">
            <div class="score" id="score">0</div>
            <button class="pause-btn" id="pauseBtn">⏸️</button>
            <div class="game-over" id="gameOver">
                <h1>GAME OVER</h1>
                <p>Your Score:</p>
                <div class="score-display" id="finalScore">0</div>
                <p>Best Score: <span id="bestScore">0</span></p>
                <button class="restart-btn" id="restartBtn">Play Again</button>
            </div>
            <div class="instructions" id="instructions">
                Click or tap to make the bird fly!<br>
                Avoid the pipes to score points.
            </div>
        </div>
        <div class="mobile-controls" id="mobileControls"></div>
    </div>

    <script>
        class FlappyBirdGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.score = 0;
                this.bestScore = localStorage.getItem('flappyBirdBestScore') || 0;
                this.gameRunning = false;
                this.gameOver = false;
                this.paused = false;
                
                // Game objects
                this.bird = {
                    x: 80,
                    y: 300,
                    width: 30,
                    height: 25,
                    velocity: 0,
                    gravity: 0.6,
                    jumpStrength: -12,
                    rotation: 0
                };
                
                this.pipes = [];
                this.groundY = this.canvas.height - 50;
                
                // Game settings
                this.pipeWidth = 60;
                this.pipeGap = 150;
                this.pipeSpeed = 2;
                this.pipeSpawnRate = 90; // frames between pipe spawns
                this.frameCount = 0;
                
                // Sound effects (using Web Audio API)
                this.audioContext = null;
                this.initAudio();
                
                this.init();
            }
            
            initAudio() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Audio not supported');
                }
            }
            
            playSound(frequency, duration, type = 'sine') {
                if (!this.audioContext) return;
                
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = type;
                
                gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + duration);
            }
            
            init() {
                this.setupEventListeners();
                this.reset();
                this.gameLoop();
            }
            
            setupEventListeners() {
                // Mobile controls
                const mobileControls = document.getElementById('mobileControls');
                mobileControls.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.handleInput();
                });
                
                // Click controls
                this.canvas.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.handleInput();
                });
                
                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' || e.code === 'ArrowUp') {
                        e.preventDefault();
                        this.handleInput();
                    }
                });
                
                // Pause button
                document.getElementById('pauseBtn').addEventListener('click', () => {
                    this.togglePause();
                });
                
                // Restart button
                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.restart();
                });
                
                // Prevent context menu on right click
                this.canvas.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                });
            }
            
            handleInput() {
                if (this.gameOver) {
                    this.restart();
                } else if (!this.gameRunning) {
                    this.start();
                } else if (!this.paused) {
                    this.bird.velocity = this.bird.jumpStrength;
                    this.playSound(400, 0.1, 'square');
                }
            }
            
            start() {
                this.gameRunning = true;
                this.gameOver = false;
                this.paused = false;
                document.getElementById('instructions').style.display = 'none';
                document.getElementById('pauseBtn').textContent = '⏸️';
            }
            
            restart() {
                this.reset();
                this.gameRunning = true;
                this.gameOver = false;
                this.paused = false;
                document.getElementById('gameOver').style.display = 'none';
                document.getElementById('instructions').style.display = 'block';
                document.getElementById('pauseBtn').textContent = '⏸️';
            }
            
            reset() {
                this.score = 0;
                this.pipes = [];
                this.frameCount = 0;
                this.bird.x = 80;
                this.bird.y = 300;
                this.bird.velocity = 0;
                this.bird.rotation = 0;
                document.getElementById('score').textContent = '0';
            }
            
            togglePause() {
                if (!this.gameRunning || this.gameOver) return;
                
                this.paused = !this.paused;
                document.getElementById('pauseBtn').textContent = this.paused ? '▶️' : '⏸️';
            }
            
            update() {
                if (!this.gameRunning || this.paused || this.gameOver) return;
                
                // Update bird
                this.bird.velocity += this.bird.gravity;
                this.bird.y += this.bird.velocity;
                
                // Update bird rotation based on velocity
                this.bird.rotation = Math.min(Math.max(this.bird.velocity * 3, -30), 90);
                
                // Check ground collision
                if (this.bird.y + this.bird.height >= this.groundY) {
                    this.gameOverSequence();
                    return;
                }
                
                // Check ceiling collision
                if (this.bird.y <= 0) {
                    this.bird.y = 0;
                    this.bird.velocity = 0;
                }
                
                // Spawn pipes
                this.frameCount++;
                if (this.frameCount % this.pipeSpawnRate === 0) {
                    this.spawnPipe();
                }
                
                // Update pipes
                for (let i = this.pipes.length - 1; i >= 0; i--) {
                    const pipe = this.pipes[i];
                    pipe.x -= this.pipeSpeed;
                    
                    // Remove pipes that are off screen
                    if (pipe.x + pipe.width < 0) {
                        this.pipes.splice(i, 1);
                        continue;
                    }
                    
                    // Check collision with pipes
                    if (this.checkPipeCollision(pipe)) {
                        this.gameOverSequence();
                        return;
                    }
                    
                    // Check if bird passed through pipe
                    if (!pipe.scored && pipe.x + pipe.width < this.bird.x) {
                        pipe.scored = true;
                        this.score++;
                        document.getElementById('score').textContent = this.score;
                        this.playSound(600, 0.2, 'sawtooth');
                        
                        // Increase difficulty
                        if (this.score % 5 === 0) {
                            this.pipeSpeed += 0.2;
                        }
                    }
                }
            }
            
            spawnPipe() {
                const minHeight = 50;
                const maxHeight = this.canvas.height - this.pipeGap - this.groundY - minHeight;
                const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
                
                this.pipes.push({
                    x: this.canvas.width,
                    topHeight: topHeight,
                    bottomY: topHeight + this.pipeGap,
                    width: this.pipeWidth,
                    scored: false
                });
            }
            
            checkPipeCollision(pipe) {
                // Check if bird is within pipe x-range
                if (this.bird.x + this.bird.width > pipe.x && 
                    this.bird.x < pipe.x + pipe.width) {
                    
                    // Check if bird hits top or bottom pipe
                    if (this.bird.y < pipe.topHeight || 
                        this.bird.y + this.bird.height > pipe.bottomY) {
                        return true;
                    }
                }
                return false;
            }
            
            gameOverSequence() {
                this.gameOver = true;
                this.gameRunning = false;
                
                // Play crash sound
                this.playSound(150, 0.5, 'sawtooth');
                
                // Update best score
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('flappyBirdBestScore', this.bestScore);
                }
                
                // Show game over screen
                setTimeout(() => {
                    document.getElementById('finalScore').textContent = this.score;
                    document.getElementById('bestScore').textContent = this.bestScore;
                    document.getElementById('gameOver').style.display = 'block';
                }, 500);
            }
            
            draw() {
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw background gradient
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(0.7, '#98FB98');
                gradient.addColorStop(1, '#90EE90');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw clouds (simple circles)
                this.drawClouds();
                
                // Draw pipes
                this.drawPipes();
                
                // Draw ground
                this.drawGround();
                
                // Draw bird
                this.drawBird();
            }
            
            drawClouds() {
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                const clouds = [
                    {x: 50, y: 80, size: 20},
                    {x: 150, y: 60, size: 25},
                    {x: 280, y: 90, size: 18},
                    {x: 320, y: 40, size: 22}
                ];
                
                clouds.forEach(cloud => {
                    this.ctx.beginPath();
                    this.ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                    this.ctx.arc(cloud.x + cloud.size * 0.8, cloud.y, cloud.size * 1.2, 0, Math.PI * 2);
                    this.ctx.arc(cloud.x - cloud.size * 0.8, cloud.y, cloud.size * 1.1, 0, Math.PI * 2);
                    this.ctx.fill();
                });
            }
            
            drawPipes() {
                this.pipes.forEach(pipe => {
                    // Top pipe
                    this.ctx.fillStyle = '#4CAF50';
                    this.ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);
                    
                    // Bottom pipe
                    this.ctx.fillRect(pipe.x, pipe.bottomY, pipe.width, this.canvas.height - pipe.bottomY);
                    
                    // Pipe caps
                    this.ctx.fillStyle = '#45a049';
                    this.ctx.fillRect(pipe.x - 5, pipe.topHeight - 30, pipe.width + 10, 30);
                    this.ctx.fillRect(pipe.x - 5, pipe.bottomY, pipe.width + 10, 30);
                    
                    // Pipe highlights
                    this.ctx.fillStyle = '#66BB6A';
                    this.ctx.fillRect(pipe.x + 5, 0, 5, pipe.topHeight - 30);
                    this.ctx.fillRect(pipe.x + 5, pipe.bottomY + 30, 5, this.canvas.height - pipe.bottomY - 30);
                });
            }
            
            drawGround() {
                // Ground
                this.ctx.fillStyle = '#8B4513';
                this.ctx.fillRect(0, this.groundY, this.canvas.width, 50);
                
                // Grass
                this.ctx.fillStyle = '#228B22';
                this.ctx.fillRect(0, this.groundY - 10, this.canvas.width, 10);
                
                // Grass details
                this.ctx.fillStyle = '#32CD32';
                for (let x = 0; x < this.canvas.width; x += 15) {
                    this.ctx.fillRect(x, this.groundY - 12 - Math.random() * 8, 3, 12);
                }
            }
            
            drawBird() {
                this.ctx.save();
                this.ctx.translate(this.bird.x + this.bird.width / 2, this.bird.y + this.bird.height / 2);
                this.ctx.rotate(this.bird.rotation * Math.PI / 180);
                
                // Bird body
                this.ctx.fillStyle = '#FFD700';
                this.ctx.beginPath();
                this.ctx.ellipse(0, 0, this.bird.width / 2, this.bird.height / 2, 0, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Bird wing
                this.ctx.fillStyle = '#FFA500';
                this.ctx.beginPath();
                this.ctx.ellipse(-8, 0, 8, 6, 0, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Bird eye
                this.ctx.fillStyle = 'white';
                this.ctx.beginPath();
                this.ctx.arc(8, -5, 4, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.fillStyle = 'black';
                this.ctx.beginPath();
                this.ctx.arc(9, -5, 2, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Bird beak
                this.ctx.fillStyle = '#FF4500';
                this.ctx.beginPath();
                this.ctx.moveTo(15, 0);
                this.ctx.lineTo(22, 3);
                this.ctx.lineTo(15, 6);
                this.ctx.closePath();
                this.ctx.fill();
                
                this.ctx.restore();
            }
            
            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }
        
        // Initialize game when page loads
        window.addEventListener('load', () => {
            new FlappyBirdGame();
        });
        
        // Handle window focus/blur for pause
        window.addEventListener('blur', () => {
            // Auto-pause when window loses focus
        });
        
        // Prevent zoom on mobile
        document.addEventListener('touchmove', function(e) {
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
